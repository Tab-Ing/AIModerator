[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "aimoderator"
version = "0.1.0"
description = "API multi-tenant para moderar comentarios de redes sociales con perfiles de uso configurables"
readme = "README.md"
requires-python = ">=3.12"
license = { text = "AGPL-3.0-or-later" }
authors = [{ name = "AIModerator" }]
keywords = ["moderation", "fastapi", "social-media", "prompt-injection", "jev-ai"]
classifiers = [
  "Development Status :: 3 - Alpha",
  "Intended Audience :: Developers",
  "License :: OSI Approved :: GNU Affero General Public License v3 or later (AGPLv3+)",
  "Programming Language :: Python :: 3.12",
  "Programming Language :: Python :: 3.13",
  "Framework :: FastAPI",
  "Topic :: Internet :: WWW/HTTP",
]

dependencies = [
  "fastapi>=0.115",
  "uvicorn[standard]>=0.32",
  "pydantic>=2.9",
  "pydantic-settings>=2.6",
  "sqlalchemy[asyncio]>=2.0.36",
  "psycopg[binary]>=3.2",
  "alembic>=1.14",
  "httpx>=0.27",
  "prometheus-client>=0.21",
]

[project.optional-dependencies]
dev = [
  "pytest>=8.3",
  "pytest-asyncio>=0.24",
  "pytest-cov>=6.0",
  "respx>=0.21",
  "ruff>=0.8",
  "mypy>=1.13",
]
local = [
  "sentence-transformers>=3.3",
  "torch>=2.4",
]
enterprise = []

[project.urls]
Homepage = "https://github.com/julio/AIModerator"
Repository = "https://github.com/julio/AIModerator"

[project.scripts]
aimoderator = "aimoderator.main:run"

[tool.hatch.build.targets.wheel]
packages = ["src/aimoderator"]

[tool.ruff]
line-length = 100
target-version = "py312"
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "C4", "SIM", "ASYNC", "S", "N"]
ignore = ["S101"]

[tool.ruff.lint.per-file-ignores]
"tests/**" = ["S101", "S105", "S106"]
"alembic/versions/**" = ["E501"]
"src/aimoderator/config.py" = ["S104", "S105"]

[tool.mypy]
python_version = "3.12"
strict = true
warn_unused_ignores = true
plugins = ["pydantic.mypy"]
mypy_path = "src"
explicit_package_bases = true

[[tool.mypy.overrides]]
module = ["httpx.*", "psycopg.*", "sentence_transformers.*", "prometheus_client.*"]
ignore_missing_imports = true

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
addopts = "-ra --strict-markers"
markers = [
  "integration: pruebas que requieren PostgreSQL",
  "live: pruebas que llaman a proveedores externos (requieren API key)",
]

[tool.coverage.run]
source = ["aimoderator"]
branch = true
